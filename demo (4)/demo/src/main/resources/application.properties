spring.application.name=demo
spring.application.name=demo

# --- Database: H2, file-based so data survives restarts ---
spring.datasource.url=jdbc:h2:file:./data/ayoubstore;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- File uploads ---
# Where images are saved on disk. Relative paths are resolved from wherever
# you run the app (the project root when using `./mvnw spring-boot:run`).
app.upload.dir=uploads/images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Owner gate ---
# Whatever you type into the "Owner password" field on the frontend form.
app.owner.password=ayoub1q2w3e4r#@

server.port=8080